# Vicinae launcher integration
# Service is managed by systemd (see `systemctl --user status vicinae.service`).
# Keybinding lives in ~/.config/hypr/bindings.conf (ALT + SPACE).

# Blur the vicinae layer surface and respect its own alpha channel.
layerrule = blur on, match:namespace vicinae
layerrule = ignore_alpha 0, match:namespace vicinae

# Skip layer animations so the launcher feels instant.
layerrule = no_anim on, match:namespace vicinae
