[[mgr.prepend_keymap]]
on = ["c", "p"]
run = "copy path"
desc = "Copy absolute path (alias of c c)"

[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "z"
run = "plugin zoxide"
desc = "Jump via zoxide"

[[mgr.prepend_keymap]]
on = "Z"
run = "plugin fzf"
desc = "Jump via fzf"
