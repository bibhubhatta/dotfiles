[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll", "drag"]

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1200
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:=nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s1', desc = "Open", for = "linux" },
  { run = 'open %s1', desc = "Open", for = "macos" },
]
browser = [
  { run = 'xdg-open %s1', desc = "Open in browser", for = "linux" },
  { run = 'open %s1', desc = "Open in browser", for = "macos" },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal", for = "linux" },
  { run = 'open -R %s1', desc = "Reveal in Finder", for = "macos" },
  { run = 'exiftool %s1; echo "Press enter to exit"; read _', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
]
play = [{ run = 'mpv --force-window %s', orphan = true, for = "unix" }]

[open]
# Deviations from the preset rules:
#   - media: also offer "open" (xdg-open), not just mpv.
#   - HTML: also offer the browser. The preset's `text/*` rule catches
#     text/html and only offers "edit", so there is no way to view a page.
# Everything else comes from Yazi's built-in rules.
prepend_rules = [
  { mime = "{audio,video}/*", use = [
    "play",
    "open",
    "reveal",
  ] },
  { mime = "text/html", use = [
    "edit",
    "browser",
    "reveal",
  ] },
]

[tasks]
file_workers = 3
plugin_workers = 5
fetch_workers = 5
preload_workers = 2
process_workers = 5
bizarre_retry = 5
image_alloc = 536870912      # 512 MB
image_bound = [10000, 10000]
suppress_preload = false

[plugin]
prepend_fetchers = [
  { url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },

  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
prepend_previewers = [
  { url = "*.md", run = "glow" },
  { mime = "text/markdown", run = "glow" },

  { mime = "application/x-executable", run = "hexyl" },
  { mime = "application/x-pie-executable", run = "hexyl" },
  { mime = "application/x-sharedlib", run = "hexyl" },
  { mime = "application/x-object", run = "hexyl" },
  { mime = "application/x-archive", run = "hexyl" },
  { mime = "application/octet-stream", run = "hexyl" },
]

[input]
cursor_blink = false

[confirm]

[pick]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
