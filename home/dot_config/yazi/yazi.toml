[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1200
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = '${EDITOR:=nvim} "$@"', desc = "$EDITOR", block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
  { run = 'open "$1"', desc = "Open", for = "macos" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
  { run = 'open -R "$1"', desc = "Reveal in Finder", for = "macos" },
  { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
]
play = [{ run = 'mpv --force-window "$@"', orphan = true, for = "unix" }]

[open]
# Only deviation from the preset rules: also offer "open" (xdg-open) for media,
# not just mpv. Everything else comes from Yazi's built-in rules.
prepend_rules = [{ mime = "{audio,video}/*", use = ["play", "open", "reveal"] }]

[tasks]
file_workers = 3
plugin_workers = 5
fetch_workers = 5
preload_workers = 2
process_workers = 5
bizarre_retry = 5
image_alloc = 536870912  # 512 MB
image_bound = [0, 0]
suppress_preload = false

[plugin]
prepend_fetchers = [
  { url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },

  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
prepend_previewers = [
  { url = "*.md", run = "glow" },
  { mime = "text/markdown", run = "glow" },

  { mime = "application/x-executable", run = "hexyl" },
  { mime = "application/x-pie-executable", run = "hexyl" },
  { mime = "application/x-sharedlib", run = "hexyl" },
  { mime = "application/x-object", run = "hexyl" },
  { mime = "application/x-archive", run = "hexyl" },
  { mime = "application/octet-stream", run = "hexyl" },
]

[input]
cursor_blink = false

[confirm]

[pick]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
